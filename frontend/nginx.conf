server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Headers básicos de segurança: nosniff evita que o navegador tente
    # reinterpretar um arquivo como um tipo diferente do Content-Type real
    # (vetor clássico de XSS via upload/asset malformado); frame-ancestors
    # impede que o site seja carregado dentro de um <iframe> de outro
    # domínio (clickjacking); Referrer-Policy evita vazar a URL completa
    # (que pode conter dado sensível em algum caminho) pra sites de terceiro
    # linkados a partir daqui. Sem Content-Security-Policy completo de
    # propósito — o app carrega fontes do Google e redireciona pro Checkout
    # hospedado do Stripe, e uma CSP mal calibrada quebraria isso sem testar
    # cada diretiva a fundo primeiro.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Arquivos com hash no nome (assets/*.js, *.css gerados pelo Vite) podem
    # cachear "pra sempre" no navegador — o hash muda sozinho quando o
    # conteúdo muda, então nunca serve algo desatualizado.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca pode cachear — é ele que referencia os assets com
    # hash certo da última build; cacheado, um deploy novo não apareceria
    # pra quem já tinha a página aberta/instalada como PWA.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA + prerender: rotas públicas geradas em build-time (ver
    # scripts/prerender.mjs) viram diretório com index.html próprio (ex.:
    # dist/lp1/index.html sob a URL "/lp1"). "$uri/index.html" serve esse
    # arquivo direto pra URL sem barra — troca por "$uri/" (resolução de
    # diretório) faria o nginx redirecionar 301 pra "/lp1/", que não bate
    # com o canonical/sitemap/llms.txt (todos sem trailing slash). Qualquer
    # outra rota sem arquivo próprio cai no index.html raiz (fallback SPA).
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # O roteamento de /api/* pro backend é feito pelo Nginx Proxy Manager
    # (Custom Location no proxy host), não aqui dentro — este container só
    # serve os arquivos estáticos do frontend.
}
