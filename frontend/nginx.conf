server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Arquivos com hash no nome (assets/*.js, *.css gerados pelo Vite) podem
    # cachear "pra sempre" no navegador — o hash muda sozinho quando o
    # conteúdo muda, então nunca serve algo desatualizado.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca pode cachear — é ele que referencia os assets com
    # hash certo da última build; cacheado, um deploy novo não apareceria
    # pra quem já tinha a página aberta/instalada como PWA.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: qualquer rota que não bata com um arquivo real cai no
    # index.html — o app não usa router hoje (é tudo estado interno), mas
    # isso deixa o servidor pronto caso um dia precise de URLs próprias por
    # tela, sem quebrar nada agora.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O roteamento de /api/* pro backend é feito pelo Nginx Proxy Manager
    # (Custom Location no proxy host), não aqui dentro — este container só
    # serve os arquivos estáticos do frontend.
}
