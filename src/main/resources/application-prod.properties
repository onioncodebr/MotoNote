# Só carregado com SPRING_PROFILES_ACTIVE=prod (ver docker-compose.prod.yml
# — melhorias.md 2.2). Antes deste arquivo, produção rodava sem nenhum
# profile ativo, caindo direto no application.properties base; isso já era
# seguro (a base não tem valor padrão pra segredo nenhum, só o profile "dev"
# afrouxa isso), mas misturava "config comum a todo ambiente" com "config
# specific de produção" no mesmo arquivo. Este profile isola só o que é
# genuinamente específico de produção — otimização de servidor, não segredo
# (segredo continua vindo de variável de ambiente, igual antes).

# Compressão gzip das respostas — a API devolve JSON puro (listagens
# paginadas, relatórios), formato que comprime muito bem. Desligada em dev
# de propósito: só adiciona overhead de CPU sem benefício nenhum quando
# cliente e servidor estão na mesma máquina.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024
