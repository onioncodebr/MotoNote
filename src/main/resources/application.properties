spring.application.name=entregas

# Sem valor padrão de propósito, mesma razão do JWT_SECRET logo abaixo: se
# SPRING_MONGODB_URI não for definida, o boot falha aqui (placeholder não
# resolvido) em vez de conectar silenciosamente numa credencial fraca
# hardcoded. Pra desenvolvimento local, ative o profile "dev"
# (SPRING_PROFILES_ACTIVE=dev), que define um valor de conveniência em
# application-dev.properties.
spring.mongodb.uri=${SPRING_MONGODB_URI}

# Sem valor padrão de propósito: se JWT_SECRET não for definido, o boot falha
# aqui (placeholder não resolvido) em vez de assinar tokens com um segredo
# previsível. Pra desenvolvimento local, ative o profile "dev"
# (SPRING_PROFILES_ACTIVE=dev), que define um valor de conveniência em
# application-dev.properties.
api.security.token.secret=${JWT_SECRET}
spring.data.mongodb.auto-index-creation=true
springdoc.api-docs.resolve-schema-properties=true
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Nunca expor stack trace do Java nas respostas de erro da API — vaza nomes
# de classes internas, estrutura de pacotes e versões de dependências pra
# qualquer cliente que provocar um erro. Os detalhes completos continuam nos
# logs do servidor normalmente. No Spring Boot 4.x essa propriedade migrou de
# "server.error.*" pra "spring.web.error.*" (ErrorProperties passou a ser
# aninhada em WebProperties, prefixo "spring.web", em vez de ServerProperties).
spring.web.error.include-stacktrace=never

# Swagger/OpenAPI desligado por padrão: documenta publicamente todos os
# endpoints da API (sem exigir login pra consultar), o que facilita
# reconhecimento por quem for tentar explorar alguma falha. Pra usar
# localmente durante o desenvolvimento, exporte SPRINGDOC_ENABLED=true.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price-id=${STRIPE_PRICE_ID:}
stripe.trial-days=${STRIPE_TRIAL_DAYS:15}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Resend — envio de e-mail transacional (código de cadastro, recuperação de
# senha, troca de telefone). Sem RESEND_API_KEY, o boot não falha (mesmo
# padrão do Stripe acima), mas os endpoints que dependem de e-mail respondem
# 503 até a chave ser configurada — ver ResendGateway e RESEND_SETUP.md.
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:MotoNote <onboarding@resend.dev>}
resend.log-fallback=${RESEND_LOG_FALLBACK:false}

# Cloudflare Turnstile — verificação anti-automação em cadastro/login/
# recuperação de senha. Sem TURNSTILE_SECRET_KEY, a validação é no-op (ver
# TurnstileGateway) — não bloqueia nada até a chave ser configurada.
turnstile.secret-key=${TURNSTILE_SECRET_KEY:}

# Cloudflare R2 — armazenamento de foto de perfil (bucket público) e
# comprovante de gasto (bucket privado, só link temporário assinado). Sem
# essas chaves, os endpoints de upload respondem 503 (ver R2Gateway e
# R2_SETUP.md) — o resto do sistema funciona normalmente.
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket-publico=${R2_BUCKET_PUBLICO:}
r2.bucket-privado=${R2_BUCKET_PRIVADO:}
r2.public-url=${R2_PUBLIC_URL:}

# Limite de tamanho de upload (foto de perfil/comprovante) — o frontend já
# comprime a imagem antes de enviar, isso aqui é só uma trava de segurança
# server-side (ver ImagemUtils, que reforça o mesmo limite por content-type).
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB