spring.application.name=entregas
spring.mongodb.uri=mongodb://admin:admin@localhost:27017/entregas?authSource=admin

# Sem valor padrão de propósito: se JWT_SECRET não for definido, o boot falha
# aqui (placeholder não resolvido) em vez de assinar tokens com um segredo
# previsível. Pra desenvolvimento local, ative o profile "dev"
# (SPRING_PROFILES_ACTIVE=dev), que define um valor de conveniência em
# application-dev.properties.
api.security.token.secret=${JWT_SECRET}
spring.data.mongodb.auto-index-creation=true
springdoc.api-docs.resolve-schema-properties=true
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Nunca expor stack trace do Java nas respostas de erro da API — vaza nomes
# de classes internas, estrutura de pacotes e versões de dependências pra
# qualquer cliente que provocar um erro. Os detalhes completos continuam nos
# logs do servidor normalmente. No Spring Boot 4.x essa propriedade migrou de
# "server.error.*" pra "spring.web.error.*" (ErrorProperties passou a ser
# aninhada em WebProperties, prefixo "spring.web", em vez de ServerProperties).
spring.web.error.include-stacktrace=never

# Swagger/OpenAPI desligado por padrão: documenta publicamente todos os
# endpoints da API (sem exigir login pra consultar), o que facilita
# reconhecimento por quem for tentar explorar alguma falha. Pra usar
# localmente durante o desenvolvimento, exporte SPRINGDOC_ENABLED=true.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price-id=${STRIPE_PRICE_ID:}
stripe.trial-days=${STRIPE_TRIAL_DAYS:15}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}