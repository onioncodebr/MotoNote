# Só carregado com --spring.profiles.active=migration (ver MigrationRunner).
# Fora desse profile, essas propriedades não existem pra aplicação.

# Caminho do backup mongodump (--archive --gzip), relativo à raiz do
# projeto se não for absoluto. mongodump.gz é o backup válido mais recente
# na raiz do projeto — não usar entregas-backup.gz (backup antigo/menor).
migration.backup-path=${MIGRATION_BACKUP_PATH:mongodump.gz}

# Nome do banco Mongo gravado dentro do backup (não é o nome do banco de
# destino no Postgres) — mongorestore restaura com o nome original.
migration.database-name=${MIGRATION_DATABASE_NAME:entregas}
