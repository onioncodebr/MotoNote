# Só carregado com SPRING_PROFILES_ACTIVE=dev. Valor de conveniência pra
# apontar pro Mongo local do docker-compose.yml (dev) sem precisar exportar
# SPRING_MONGODB_URI a cada vez — nunca deve ser usado fora do ambiente do
# desenvolvedor.
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://admin:admin@localhost:27017/entregas?authSource=admin}

# Só carregado com SPRING_PROFILES_ACTIVE=dev. Segredo de conveniência para
# rodar localmente sem precisar exportar JWT_SECRET a cada vez — nunca deve
# ser usado fora do ambiente do desenvolvedor.
api.security.token.secret=${JWT_SECRET:minhachavesupersecretadedesenvolvimentosassentrega}

# Cookie de sessão sem o atributo Secure em dev, senão o browser nunca manda
# o cookie de volta (dev local roda em HTTP puro, sem TLS).
app.cookie-secure=false

# Sem RESEND_API_KEY configurada, os e-mails de código (cadastro/recuperação
# de senha/troca de telefone) só são logados em vez de enviados de verdade —
# dá pra testar o fluxo inteiro em dev sem conta no Resend (ver ResendGateway).
resend.log-fallback=true
